apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-back-comgas-deployment
  namespace: physisiot
  labels:
    app: pm-back-comgas

spec: 
  template:
    metadata:
      name: pm-back-comgas-pod
      labels:
        app: pm-back-comgas-pod
    spec:
      #hostNetwork: truea
      containers:
        - name: pm-back-comgas
          image: app_pm_back-app_pm_back
          imagePullPolicy: Never
          ports:
          - containerPort: 60135
            protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://*:60135"
            - name: ASPNETCORE_HTTPS_PORT
              value: "60135"
            - name: ASPNETCORE_ENVIRONMENT
              value: "development"
            - name: DATABASE_SCHEMA
              value: "comgas"
            - name: DATABASE_CONNECTION
              value: "Server=10.3.192.199;Port=5432;Database=postgres;User Id=postgres;Password=42rI1FxGCOuv"
            - name: TWINS_KEY
              value: "Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$Ab2/#C$x8y"
            - name: Keycloak__ClientId
              value: "comgas§pm"
            - name: Keycloak__Url
              value: "$(KEYCLOAK__URL)"
            - name: Keycloak__Authority
              value: "$(KEYCLOAK__AUTHORITY)"
          envFrom:
          - configMapRef:
              name: env-config
  selector:
    matchLabels:
      app: pm-back-comgas-pod
  replicas: 1

---
apiVersion: v1
kind: Service
metadata:
  name: pm-back-comgas-service
  namespace: physisiot
spec:
  type: ClusterIP
  selector:
    app: pm-back-comgas-pod
  ports:
    - name: socket
      port: 60135
      targetPort: 60135

