version: '3.3'

services:
  app_pm_back:
    #nome
    container_name: app_pm_back
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5234:5234"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5234
      - Kafka__BootstrapServers=${KAFKA_BROKER_1}
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Database=
    networks:
      - default

volumes:
  notas-data:

networks:
  default:
    external:
      name: bluenetwork