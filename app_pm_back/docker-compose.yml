version: '3.3'

services:
  app_pm_back:
    #nome
    container_name: app_pm_back
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:5234:8080"
    environment:
      Kafka__BootstrapServers: ${KAFKA_BROKER_1}
      MongoDb__ConnectionString: ${PHYSIS_MONGO_DB}
    networks:
      - default

volumes:
  arvore-data:

networks:
  default:
    external:
      name: bluenetwork