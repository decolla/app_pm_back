# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4

trigger:
  - main
  - dev

pool:
  vmImage: 'windows-latest'

variables:
  solution: '$(Build.SourcesDirectory)/**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  DATABASE_SCHEMA: 'cg'

stages:
  - stage: Build
    displayName: 'Build stage'
    
    jobs:
      - job: BuildJob
        displayName: 'Build Job'
        
        steps:
          - task: NuGetToolInstaller@1

          - task: NuGetCommand@2
            inputs:
              restoreSolution: '$(solution)'

          - task: VSBuild@1
            inputs:
              solution: '$(solution)'
              msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'

          - task: VSTest@2
            inputs:
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: 'Deploy stage'
    
    jobs:
      - job: DeployJob
        displayName: 'Deploy Job'
        steps:

          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'specific'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: AzureRmWebAppDeployment@4
            condition: eq(variables['Build.SourceBranchName'], 'dev')
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'WebAppConnection'
              appType: 'webApp'
              WebAppName: 'PMDev'
              packageForLinux: '$(System.ArtifactsDirectory)/**/*.zip'
              AppSettings: >
                -TWINS_URL https://digital-twins-web-app-fgbxc4adfkdheacc.brazilsouth-01.azurewebsites.net
                -DATABASE_SCHEMA $(DATABASE_SCHEMA)

          - task: AzureRmWebAppDeployment@4
            condition: eq(variables['Build.SourceBranchName'], 'main')
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'ProdConnection'
              appType: 'webApp'
              WebAppName: 'twins-pm'
              packageForLinux: '$(System.ArtifactsDirectory)/**/*.zip'
              AppSettings: >
                -TWINS_URL https://twins-back-fgg7g6f2befde6hc.brazilsouth-01.azurewebsites.net
                -DATABASE_SCHEMA $(DATABASE_SCHEMA)